{{- if or .Values.service.headless (eq .Values.kind "statefulset") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic.fullname" . }}-peers
  labels:
    {{- include "generic.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.portName }}
      protocol: TCP
      name: {{ .Values.service.portName }}
    {{- if (gt (len .Values.service.additionalPorts) 0) }}
    {{ .Values.service.additionalPorts | toYaml | nindent 4 }}
    {{- end }}
  selector:
    {{- include "generic.selectorLabels" . | nindent 4 }}
{{- end }}
